<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} · Lex-Indic</title>
  <link rel="stylesheet" href="/static/lex-design-system.css">
  <style>
    body { background: linear-gradient(135deg, #0f2850 0%, #1a3a6e 100%); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .error-shell { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px; }
    .error-card { max-width: 480px; text-align: center; }
    .error-code { font-size: 96px; font-weight: 900; color: #f0a500; margin: 0; line-height: 1; letter-spacing: -2px; }
    .error-title { font-size: 24px; font-weight: 700; margin: 12px 0 8px; }
    .error-msg { color: rgba(255,255,255,0.7); margin: 0 0 24px; font-size: 14px; }
    .btn { display: inline-block; padding: 11px 22px; background: #f0a500; color: #fff; border-radius: 6px; text-decoration: none; font-weight: 700; margin: 4px; }
    .btn:hover { background: #d99000; color: #fff; }
    .btn-ghost { background: transparent; border: 1.5px solid rgba(255,255,255,0.4); }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }
    .quick-links { margin-top: 30px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.15); }
    .quick-links a { color: #f0a500; margin: 0 10px; text-decoration: none; font-size: 13px; }
    .quick-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  {% include '_nav.html' %}
  <div class="error-shell">
    <div class="error-card">
      <div class="error-code">{{ code }}</div>
      <div class="error-title">{{ title }}</div>
      <p class="error-msg">{{ message }}</p>
      <a href="/" class="btn">← Back to home</a>
      <a href="/app" class="btn btn-ghost">Try the analyzer</a>
      <div class="quick-links">
        <a href="/pricing">Pricing</a>
        <a href="/nalsa">NALSA (Free)</a>
        <a href="/trust">Trust + DPDP</a>
        <a href="/status">Status</a>
        <a href="/api/v1/docs">API</a>
      </div>
    </div>
  </div>
</body>
</html>
