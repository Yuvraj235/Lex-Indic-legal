<!--
  Lex-Indic shared top bar. Include right after <body>; the matching styles,
  favicon and preview tags live in _head.html (include that inside <head>).
  Highlights the active page; shows "Sign in" or the account menu.
-->
<nav class="lex-topbar" id="lexTopbar" data-current-path="{{ request.path if request else '/' }}" aria-label="Main">
  <div class="lex-topbar-inner">
    <a href="/" class="lex-brand" aria-label="Lex-Indic home"><span class="lex-brand-mark">L</span><span class="lex-brand-text">LEX-INDIC</span></a>

    <div class="lex-nav-group">
      <a href="/app" class="lex-nav-link" data-path="/app">Case Brief</a>
      <a href="/convert" class="lex-nav-link" data-path="/convert">Convert</a>
      <a href="/tabular" class="lex-nav-link" data-path="/tabular">Contract Review</a>
      <a href="/monitors" class="lex-nav-link" data-path="/monitors">SC Monitor</a>
      <a href="/matters" class="lex-nav-link" data-path="/matters">Matters</a>
      <a href="/ecourts" class="lex-nav-link" data-path="/ecourts">e-Courts</a>
    </div>

    <span class="lex-nav-divider" aria-hidden="true"></span>

    <div class="lex-nav-group">
      <a href="/pricing" class="lex-nav-link" data-path="/pricing">Pricing</a>
      <a href="/nalsa" class="lex-nav-link" data-path="/nalsa">NALSA (Free)</a>
      <a href="/trust" class="lex-nav-link" data-path="/trust">Trust + DPDP</a>
    </div>

    <div class="lex-nav-right">
      <details class="lex-menu" id="lexMore">
        <summary data-paths="/status /audit /dashboard /admin/soc2 /api/v1/docs /addin/install">More <span class="lex-caret" aria-hidden="true"></span></summary>
        <div class="lex-menu-panel" role="menu">
          <div class="lex-menu-label">Workspace</div>
          <a href="/audit" data-path="/audit" role="menuitem">Statute migration audit</a>
          <a href="/status" data-path="/status" role="menuitem">System status</a>
          <a href="/addin/install" data-path="/addin/install" role="menuitem">Word add-in</a>
          <div class="lex-menu-label">Developers</div>
          <a href="/api/v1/docs" data-path="/api/v1/docs" role="menuitem">API docs</a>
          <a href="/profile#api-keys" role="menuitem">API keys</a>
          <a href="/status#webhooks" role="menuitem">Webhooks</a>
          <div class="lex-menu-label">Admin</div>
          <a href="/dashboard" data-path="/dashboard" role="menuitem">Operator dashboard</a>
          <a href="/admin/soc2" data-path="/admin/soc2" role="menuitem">SOC 2 readiness</a>
        </div>
      </details>

      <div class="lex-lang" id="lexLangSwitch" role="group" aria-label="Language" hidden>
        <button type="button" id="lexLangEn" data-lang="en">EN</button>
        <button type="button" id="lexLangHi" data-lang="hi">हिन्दी</button>
      </div>

      <a href="/login" class="lex-signin" id="lexSignIn" hidden>Sign in</a>
      <details class="lex-menu lex-account" id="lexAccount" hidden>
        <summary aria-label="Account"><span class="lex-avatar" id="lexAvatar">·</span><span class="lex-caret" aria-hidden="true"></span></summary>
        <div class="lex-menu-panel" role="menu">
          <div class="lex-menu-email" id="lexAccountEmail"></div>
          <a href="/profile" data-path="/profile" role="menuitem">Profile &amp; preferences</a>
          <a href="/profile#api-keys" role="menuitem">API keys</a>
          <button type="button" id="lexSignOut" role="menuitem">Sign out</button>
        </div>
      </details>
    </div>
  </div>
</nav>

<script>
  (function () {
    const topbar = document.getElementById('lexTopbar');
    if (!topbar) return;
    const current = (topbar.dataset.currentPath || location.pathname).replace(/\/$/, '') || '/';
    const matches = p => p && (p === current || (p !== '/' && current.startsWith(p + '/')));

    // Active page: links in the bar and inside the menus; a menu's summary
    // is highlighted when the current page lives inside it.
    topbar.querySelectorAll('[data-path]').forEach(a => {
      if (matches((a.dataset.path || '').replace(/\/$/, ''))) a.classList.add('active');
    });
    topbar.querySelectorAll('summary[data-paths]').forEach(s => {
      if (s.dataset.paths.split(' ').some(matches)) s.classList.add('active');
    });

    // Full-height layouts under the bar (e.g. /app) size themselves with
    // calc(100vh - var(--lex-topbar-h)).
    const setHeight = () =>
      document.documentElement.style.setProperty('--lex-topbar-h', topbar.offsetHeight + 'px');
    setHeight();
    if (window.ResizeObserver) new ResizeObserver(setHeight).observe(topbar);

    // Deeper shadow once the page scrolls under the bar.
    const onScroll = () => topbar.classList.toggle('is-scrolled', window.scrollY > 4);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    // Menus: one open at a time; close on outside click or Escape.
    const menus = [...topbar.querySelectorAll('details.lex-menu')];
    menus.forEach(m => m.addEventListener('toggle', () => {
      if (m.open) menus.forEach(o => { if (o !== m) o.open = false; });
    }));
    document.addEventListener('click', e => {
      menus.forEach(m => { if (m.open && !m.contains(e.target)) m.open = false; });
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') menus.forEach(m => { if (m.open) { m.open = false; m.querySelector('summary').focus(); } });
    });

    // Account: "Sign in" when signed out, the account menu when signed in.
    const signIn = document.getElementById('lexSignIn');
    const account = document.getElementById('lexAccount');
    const showUser = user => {
      if (user && user.email) {
        document.getElementById('lexAvatar').textContent = user.email.charAt(0).toUpperCase();
        document.getElementById('lexAccountEmail').textContent = user.email;
        account.hidden = false; signIn.hidden = true;
      } else {
        account.hidden = true; signIn.hidden = current === '/login';
      }
    };
    let cached = null;
    try { cached = JSON.parse(sessionStorage.getItem('lexindic.me') || 'null'); } catch (e) {}
    if (cached) showUser(cached.user);
    fetch('/auth/me', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : { authenticated: false })
      .then(d => {
        const user = d.authenticated ? d.user : null;
        try { sessionStorage.setItem('lexindic.me', JSON.stringify({ user })); } catch (e) {}
        showUser(user);
      })
      .catch(() => showUser(cached && cached.user));
    document.getElementById('lexSignOut').addEventListener('click', async () => {
      try { await fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
      try { sessionStorage.removeItem('lexindic.me'); } catch (e) {}
      location.href = '/login';
    });

    // EN / हिन्दी switch — shown only on pages that ship an i18n runtime
    // (setLexLang on most pages, setUiLang on /app).
    const sw = document.getElementById('lexLangSwitch');
    const mark = lang => sw.querySelectorAll('button').forEach(
      b => b.classList.toggle('active', b.dataset.lang === lang));
    sw.addEventListener('click', e => {
      const lang = e.target.dataset && e.target.dataset.lang;
      const setLang = window.setLexLang || window.setUiLang;
      if (!lang || !setLang) return;
      setLang(lang);
      mark(lang);
    });
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof window.setLexLang !== 'function' && typeof window.setUiLang !== 'function') return;
      sw.hidden = false;
      let saved = 'en';
      try { saved = localStorage.getItem('lexindic.lang') || 'en'; } catch (e) {}
      mark(saved);
    });
  })();
</script>
<script src="/static/lex-design-system.js" defer></script>
