<!--
  Lex-Indic shared top-navigation bar + favicon + Open Graph meta.
  Include in every template with the standard Jinja include directive.
  Highlights the active page via data-current-path.
-->

<!-- Favicon + Open Graph + Twitter Card (polish sprint) -->
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="apple-touch-icon" href="/static/img/favicon.svg">
<meta property="og:title" content="Lex-Indic — AI Junior Associate for Indian Law">
<meta property="og:description" content="The BNS Transition Engine. Citation-traceable legal analysis, DPDP-compliant audit, white-label PDFs. Free for NALSA panel advocates.">
<meta property="og:image" content="/static/img/og-card.svg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lex-indic.in">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Lex-Indic — AI Junior Associate for Indian Law">
<meta name="twitter:description" content="BNS / BNSS / BSA — citation-traceable, DPDP-compliant. 31 days shipped.">
<meta name="twitter:image" content="/static/img/og-card.svg">
<meta name="theme-color" content="#0f2850">
<style>
  .lex-topbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
    background: linear-gradient(135deg, #0f2850 0%, #1a3a6e 100%);
    color: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 13.5px;
  }
  .lex-topbar-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 9px 18px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .lex-brand {
    font-weight: 700;
    color: #f0a500;
    font-size: 15px;
    margin-right: 18px;
    text-decoration: none;
    letter-spacing: 0.5px;
  }
  .lex-brand:hover { color: #ffc94c; }
  .lex-nav-link {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    padding: 6px 11px;
    border-radius: 6px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .lex-nav-link:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }
  .lex-nav-link.active {
    background: rgba(240, 165, 0, 0.2);
    color: #f0a500;
    font-weight: 600;
  }
  .lex-nav-group {
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .lex-nav-divider {
    width: 1px;
    height: 16px;
    background: rgba(255,255,255,0.2);
    margin: 0 6px;
  }
  .lex-nav-admin {
    margin-left: auto;
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .lex-nav-admin .lex-nav-link {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
  }
  .lex-nav-admin .lex-nav-link:hover {
    color: #f0a500;
  }
  @media (max-width: 900px) {
    .lex-nav-divider, .lex-brand { display: none; }
    .lex-nav-admin { margin-left: 0; }
    .lex-topbar-inner { padding: 7px 10px; gap: 2px; }
    .lex-nav-link { padding: 5px 8px; font-size: 12.5px; }
  }
  @media (max-width: 600px) {
    .lex-nav-link { padding: 5px 7px; font-size: 12px; }
    .lex-nav-admin .lex-nav-link { font-size: 11px; }
  }

  /* Shared empty-state styling — used by /matters /monitors /webhooks etc. */
  .lex-empty {
    text-align: center;
    padding: 40px 22px;
    color: #888;
    background: rgba(15,40,80,0.03);
    border: 2px dashed rgba(15,40,80,0.15);
    border-radius: 10px;
    margin: 16px 0;
  }
  .lex-empty .lex-empty-icon { font-size: 42px; margin-bottom: 10px; opacity: 0.5; }
  .lex-empty h3 { color: #0f2850; font-size: 17px; margin: 0 0 6px; }
  .lex-empty p { font-size: 13px; margin: 0 0 14px; max-width: 380px; margin-left: auto; margin-right: auto; }
  .lex-empty .btn { display: inline-block; padding: 9px 16px; background: #0f2850; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 13px; }
  .lex-empty .btn:hover { background: #1a3a6e; color: #fff; }
</style>

<nav class="lex-topbar" id="lexTopbar" data-current-path="{{ request.path if request else '/' }}">
  <div class="lex-topbar-inner">
    <a href="/" class="lex-brand">LEX-INDIC</a>

    <div class="lex-nav-group">
      <a href="/" class="lex-nav-link" data-path="/">Home</a>
      <a href="/app" class="lex-nav-link" data-path="/app">Case Brief</a>
      <a href="/convert" class="lex-nav-link" data-path="/convert">Convert</a>
      <a href="/tabular" class="lex-nav-link" data-path="/tabular">Contract Review</a>
      <a href="/monitors" class="lex-nav-link" data-path="/monitors">SC Monitor</a>
      <a href="/matters" class="lex-nav-link" data-path="/matters">Matters</a>
      <a href="/ecourts" class="lex-nav-link" data-path="/ecourts">e-Courts</a>
    </div>

    <span class="lex-nav-divider"></span>

    <div class="lex-nav-group">
      <a href="/pricing" class="lex-nav-link" data-path="/pricing">Pricing</a>
      <a href="/nalsa" class="lex-nav-link" data-path="/nalsa">NALSA (Free)</a>
      <a href="/trust" class="lex-nav-link" data-path="/trust">Trust + DPDP</a>
      <a href="/status" class="lex-nav-link" data-path="/status">Status</a>
    </div>

    <div class="lex-nav-admin">
      <a href="/api/v1/docs" class="lex-nav-link" data-path="/api/v1/docs">API Docs</a>
      <a href="/dashboard" class="lex-nav-link" data-path="/dashboard">Dashboard</a>
      <a href="/admin/api-keys" class="lex-nav-link" data-path="/admin/api-keys">API Keys</a>
      <a href="/webhooks" class="lex-nav-link" data-path="/webhooks">Webhooks</a>
      <a href="/profile" class="lex-nav-link" data-path="/profile">Profile</a>
      <a href="/auth/login" class="lex-nav-link" data-path="/auth/login">Login</a>
    </div>
  </div>
</nav>

<script>
  // Highlight the active nav link based on current path
  (function() {
    const topbar = document.getElementById('lexTopbar');
    if (!topbar) return;
    const current = (topbar.dataset.currentPath || window.location.pathname).replace(/\/$/, '') || '/';
    topbar.querySelectorAll('.lex-nav-link').forEach(link => {
      const linkPath = (link.dataset.path || '').replace(/\/$/, '') || '/';
      if (linkPath === current ||
          (linkPath !== '/' && current.startsWith(linkPath))) {
        link.classList.add('active');
      }
    });
  })();
</script>
